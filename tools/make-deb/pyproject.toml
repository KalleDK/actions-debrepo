[project]
name = "make-deb"
version = "0.1.0"
description = "Tools for building and signing a Debian APT repository inside a GitHub Actions workflow"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "typer>=0.12.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
